# The release: on a version tag, every artifact from the same commit, each
# checked the way the tree is checked, then attached to the GitHub release,
# the image pushed to ghcr.io, the wheels to PyPI once the `pypi`
# environment's reviewer approves, and the Rust crate to crates.io once the
# `crates-io` environment's does. docs/packaging.md describes the
# artifacts; the scripts under packaging/ build them the same way locally.
# A job's token reads the repository and nothing more unless the job says
# so: the image job's pushes to ghcr.io, the release job's writes the
# release, and the registry jobs' asks for the OIDC token trusted
# publishing takes; no checkout keeps its token on disk. Every action is
# pinned to a commit, its version beside it, and moves only through a pull
# request, which .github/dependabot.yml opens.
name: release
on:
  push:
    tags: ["v*"]
  # By hand, from the Actions tab or `gh workflow run release.yml -f tag=v2.3.0rc1`:
  # the same build from the chosen branch, its files named after `tag`, the
  # release step skipped, and the wheels uploaded to test.pypi.org instead
  # of PyPI and installed from there for the smoke test, so that a run can
  # be tried before tagging. TestPyPI never accepts a version twice, so the
  # tag given is one that will not be released, a release candidate.
  workflow_dispatch:
    inputs:
      tag:
        description: the version tag the files are named after, such as v2.1.0
        required: true
permissions:
  contents: read
env:
  VERSION: ${{ inputs.tag || github.ref_name }}
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tag names the version the source carries, which the Version
      # commit raises in each of these: one on another commit fails here,
      # before anything is built or published.
      - if: github.event_name == 'push'
        run: |
          for found in \
              "multiplexer/release.py $(sed -n 's/^version = "\(.*\)"$/\1/p' multiplexer/release.py)" \
              "lib/release.cc $(sed -n 's/^const char\* const version = "\(.*\)";$/\1/p' lib/release.cc)" \
              "Makefile $(sed -n 's/^VERSION ?= //p' Makefile)" \
              "rust/mx-multiplexer/Cargo.toml $(sed -n 's/^version = "\(.*\)"$/\1/p' rust/mx-multiplexer/Cargo.toml)"; do
            if [ "${found#* }" != "${VERSION#v}" ]; then
              echo "${found% *} says ${found#* }, the tag ${VERSION#v}: the Version commit raises every one" >&2
              exit 1
            fi
          done
      - run: sudo apt-get install -y -qq g++ protobuf-compiler libprotobuf-dev python3-dev python3-protobuf
      # Bazel's linux-sandbox gives each test a network of its own through an
      # unprivileged user namespace, which Ubuntu 24.04's AppArmor withholds.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: bazel test --test_env=MX_REQUIRE_PRIVATE_NETWORK=1 //...
      # What is published is a release build: everything compiled the same
      # way first, so that a warning only -O2 raises fails here.
      - run: bazel build --config=release //...

  binary:
    # The release's mxcontrol, built as the wheels' one is, inside the
    # manylinux container: protobuf, RE2 and libstdc++ linked in, glibc 2.28
    # or newer from the system, all checked by packaging/binary.sh. The
    # image runs the same file. The system rules are the Makefile's default.
    needs: tests
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$PWD" && packaging/binary.sh "${VERSION#v}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary
          path: dist/

  image:
    # The image: that binary on distroless base-nossl, built reproducibly by
    # packaging/build_image.sh, started once as a multiplexer and asked for
    # the rules it read, and on a tag pushed to ghcr.io with the version and
    # as latest. Built once every other check passed, so that a run that
    # fails one publishes nothing.
    needs: [binary, debs, wheels, smoke, crate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary
          path: binary
      - name: the image, serving once
        run: |
          chmod +x binary/mxcontrol-*-linux-amd64
          packaging/build_image.sh binary/mxcontrol-${VERSION#v}-linux-amd64 multiplexer:dev
          docker run -d --name mx -p 127.0.0.1:1980:1980 multiplexer:dev
          # Exits 1 unless the multiplexer, as nonroot, read its rules and answers.
          binary/mxcontrol-${VERSION#v}-linux-amd64 rules status -M 127.0.0.1:1980 --timeout 30
          docker rm -f mx
      - name: image to ghcr.io
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "${VERSION#v}" latest; do
            docker tag multiplexer:dev "ghcr.io/kulewski/multiplexer:$tag"
            docker push "ghcr.io/kulewski/multiplexer:$tag"
          done

  debs:
    # One package per release, built against that release's protobuf.
    needs: tests
    strategy:
      matrix:
        base: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.base }}
    steps:
      - run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git g++ make protobuf-compiler libprotobuf-dev libasio-dev libre2-dev python3-dev python3-protobuf pybind11-dev python3-pybind11 libgtest-dev dpkg-dev ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$PWD" && packaging/deb.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ strategy.job-index }}
          path: dist/*.deb

  wheels:
    # manylinux wheels for every CPython from 3.10, protobuf built in.
    needs: tests
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$PWD" && packaging/wheels.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: dist/*.whl

  crate:
    # The Rust crate as crates.io gets it: `cargo package` builds it from the
    # packaged files alone, as a user's cargo will. On a tag its version must
    # be the tag's; a run by hand only packages it, an rc's name being none
    # the crate carries.
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' mx-multiplexer/Cargo.toml)"
          if [ "${{ github.event_name }}" = push ] && [ "$version" != "${VERSION#v}" ]; then
            echo "the crate is $version, the tag ${VERSION#v}: the Version commit raises both" >&2
            exit 1
          fi
          cargo package -p mx-multiplexer
        working-directory: rust
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: rust/target/package/mx-multiplexer-*.crate

  smoke:
    # Each end of the CPythons the wheels are for, on a distribution of its
    # own: the wheel installed into a fresh environment and smoke-tested
    # with the mxcontrol it carries, then with the release's binary of the
    # same run, whose rules and constants must be the wheel's. Twice more on
    # 3.10: with the oldest protobuf make/setup.py allows, and on Ubuntu
    # 22.04 beside the distribution's own protobuf 3.12, which that floor
    # must replace.
    needs: [binary, wheels]
    strategy:
      matrix:
        include:
          - {python: "3.10", image: "python:3.10-slim"}
          - {python: "3.14", image: "python:3.14-slim"}
          - {python: "3.10", image: "python:3.10-slim", protobuf: "protobuf==3.20.3"}
          - {python: "3.10", image: "ubuntu:22.04", apt: "python3-venv python3-protobuf", venv: "--system-site-packages"}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - if: matrix.apt
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ${{ matrix.apt }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary
          path: binary
      - run: |
          tag="cp$(echo "${{ matrix.python }}" | tr -d .)"
          python3 -m venv ${{ matrix.venv }} /venv
          /venv/bin/pip install -q dist/*-"$tag"-"$tag"-*.whl ${{ matrix.protobuf }}
          /venv/bin/python make/wheel_smoke.py
          chmod +x binary/mxcontrol-*-linux-amd64
          MXCONTROL="$PWD/$(ls binary/mxcontrol-*-linux-amd64)" /venv/bin/python make/wheel_smoke.py

  release:
    needs: [binary, image, debs, wheels, smoke, crate]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: false

  testpypi:
    # The dry run's upload: the wheels to test.pypi.org through trusted
    # publishing, then `pip install` from there into a fresh environment
    # and the wheel's smoke test, with the mxcontrol it carries and then
    # with the release's binary of the same run. The `testpypi` environment on
    # GitHub and the pending publisher on test.pypi.org name this workflow
    # file and that environment.
    needs: [binary, wheels, smoke]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary
          path: binary
      - name: install from test.pypi.org and run the smoke test
        run: |
          python3 -m venv venv
          # The dependency from PyPI proper, then the package alone from
          # TestPyPI, which takes a moment to serve a fresh upload: two
          # steps, so that nothing on TestPyPI can stand in for protobuf.
          venv/bin/pip install -q protobuf
          for attempt in $(seq 20); do
            venv/bin/pip install -q --no-deps --index-url https://test.pypi.org/simple/ "mx-multiplexer==${VERSION#v}" && break
            sleep 15
          done
          venv/bin/python -c "import multiplexer; print(multiplexer.__file__)"
          venv/bin/python make/wheel_smoke.py
          chmod +x binary/mxcontrol-*-linux-amd64
          # The smoke test changes directory before it starts the multiplexer: an absolute path.
          MXCONTROL="$PWD/$(ls binary/mxcontrol-*-linux-amd64)" venv/bin/python make/wheel_smoke.py

  pypi:
    # The wheels to PyPI, after the release exists and once the `pypi`
    # environment's reviewer approves in the Actions tab; trusted
    # publishing, no token anywhere.
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/mx-multiplexer/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  crates-io:
    # The crate to crates.io, after the release exists and once the
    # `crates-io` environment's reviewer approves in the Actions tab;
    # trusted publishing, the run's OIDC token exchanged for a crates.io
    # token that lasts half an hour, no token kept anywhere. crates.io
    # trusts a publisher only for a crate that exists: the first version
    # was published by hand (docs/packaging.md).
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
      url: https://crates.io/crates/mx-multiplexer
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish -p mx-multiplexer
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
