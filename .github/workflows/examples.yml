# The examples installed with pip, checked the way a reader runs them:
# each one's test.sh, in a virtual environment with its requirements from
# PyPI. The library and the multiplexer are the tree's, the wheel the
# Makefile builds and the mxcontrol inside it, so that a change to either
# is checked against the examples before it is released: on changes to
# them or to the examples, by hand, and weekly, since the requirements are
# not pinned and a new release of one is what breaks an example.
name: examples
on:
  push:
    paths: ["examples/**", "lib/**", "multiplexer/**", "mxcontrol/**", "make/**", "Makefile", ".github/workflows/examples.yml"]
  pull_request:
    paths: ["examples/**", "lib/**", "multiplexer/**", "mxcontrol/**", "make/**", "Makefile", ".github/workflows/examples.yml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pip-examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq g++ make protobuf-compiler libprotobuf-dev libasio-dev libre2-dev python3-dev python3-venv python3-setuptools python3-wheel python3-protobuf pybind11-dev python3-pybind11
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-examples-${{ runner.os }}-${{ hashFiles('examples/*/requirements*.txt') }}
      - run: make -j"$(nproc)" wheel
      # The wheel goes into one venv the pip examples share first; their
      # requirements then find mx-multiplexer satisfied and leave it in place.
      - run: python3 -m venv examples/.venv && examples/.venv/bin/pip install -q build/dist/*.whl
      - run: VENV="$PWD/examples/.venv" EXAMPLES_PIP=1 examples/test_all.sh
