# On every push and pull request, four of the checks ./check.sh runs, each
# a job of its own: ./format.sh --check, the formatting and the generated
# files, with the tools pinned in requirements-dev.txt and
# tools/dev_tools.sh, the ones a check on a developer's machine uses; the
# fast tests, and ThreadSanitizer over the multiplexer on several event
# loops; the fast tests built with clang against libc++
# (--config=libcxx), which runs the thread-safety analysis on the way; and
# the Rust library's. The Rust targets are tagged rust, and only the rust
# job builds them, so that the other jobs never fetch a Rust toolchain. The
# rest of ./check.sh, the Mermaid rendering, the analysis against
# libstdc++, the sanitizers and the example workspaces, runs before a
# change goes in; release.yml runs every test at a tag, and examples.yml
# the pip examples.
name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make/generate_sources.py asks Bazel for the Makefile's source lists,
      # which configures the Python extension's headers: python3-dev. The
      # Rust protocol code is generated again with the system's protoc, and
      # cargo is the image's rustup, which installs the release
      # rust-toolchain.toml pins.
      - run: sudo apt-get install -y -qq python3-dev python3-venv protobuf-compiler
      - run: ./format.sh --check

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get install -y -qq g++ protobuf-compiler libprotobuf-dev python3-dev python3-protobuf
      # Bazel's linux-sandbox gives each test a network of its own through an
      # unprivileged user namespace, which Ubuntu 24.04's AppArmor withholds.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: bazel test --build_tag_filters=-rust --test_tag_filters=-slow,-rust --test_env=MX_REQUIRE_PRIVATE_NETWORK=1 //...
      # ThreadSanitizer over the multiplexer on several event loops: its
      # unit tests, and the scenarios whose roles are C++ with every
      # multiplexer on two loops (AGENTS.md's commands say why the tunable).
      # The runner's kernel randomizes mappings over more bits than the
      # sanitizer's runtime takes.
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: bazel test --config=tsan //lib:adaptive_mutex_test //multiplexer:server_loops_test //multiplexer/io:shared_outgoing_test //multiplexer:write_through_test //multiplexer:several_loops_test
      - run: bazel test --config=tsan --test_env=MX_SERVER_THREADS=2 --test_env=GLIBC_TUNABLES=glibc.rtld.optional_static_tls=262144 --test_env=MX_REQUIRE_PRIVATE_NETWORK=1 --build_tests_only --test_tag_filters=lang-cc,-lang-py,-lang-rust,-lang-bin,-slow //tests/scenarios/...

  libcxx:
    # The fast tests against libc++, the standard library a build of @mx
    # with clang may use instead of libstdc++ (.bazelrc): protoc and
    # libprotobuf come from source in that configuration, so only the
    # Python runtime of protobuf comes from the system.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get install -y -qq clang-18 libc++-18-dev python3-dev python3-protobuf
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: bazel test --config=libcxx --build_tag_filters=-rust --test_tag_filters=-slow,-rust --test_env=MX_REQUIRE_PRIVATE_NETWORK=1 //...

  rust:
    # The Rust library: its fast tests under Bazel, which fetches the
    # compiler and the crates, with the scenarios that run the Rust test
    # roles, every Rust target being tagged rust; the crates Bazel builds,
    # vendored again with rust/vendor.sh's own cargo and compared; clippy,
    # whose warnings are errors, an unsafe block without its SAFETY comment
    # one by every Cargo.toml's [lints], over the library, the roles and the
    # Cargo examples; the
    # crate's documentation, what docs.rs shows, without a warning; the Cargo
    # examples' tests; the build at the oldest Rust its manifest says it
    # supports; and the package crates.io would get.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get install -y -qq g++ protobuf-compiler libprotobuf-dev python3-dev python3-protobuf
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: bazel test --build_tag_filters=rust --test_tag_filters=rust,-slow --test_env=MX_REQUIRE_PRIVATE_NETWORK=1 //...
      - run: rust/vendor.sh --check
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - run: |
          for manifest in tests/roles/rust/Cargo.toml examples/*/Cargo.toml; do
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          done
      - run: cargo doc --no-deps -p mx-multiplexer
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
      # The Cargo examples, each against the multiplexer the tests above built.
      - run: |
          for manifest in examples/*/Cargo.toml; do
            MXCONTROL="$PWD/bazel-bin/mxcontrol/mxcontrol" "$(dirname "$manifest")/test.sh"
          done
      - run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' mx-multiplexer/Cargo.toml)"
          rustup toolchain install "$version" --profile minimal
          cargo "+$version" build -p mx-multiplexer
        working-directory: rust
      - run: cargo publish --dry-run -p mx-multiplexer
        working-directory: rust
