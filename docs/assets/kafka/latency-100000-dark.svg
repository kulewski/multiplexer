<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">Not batching, 100,000 records a second</title>
<desc id="description">multiplexer, p50: 9 µs; Kafka, p50: 54 µs. multiplexer, p99: 46 µs; Kafka, p99: 1.2 ms.</desc>
<rect width="960" height="400" rx="6" fill="#0d1117"/>
<text x="24" y="44" font-size="24" font-weight="600" fill="#f0f6fc">Not batching, 100,000 records a second</text>
<text x="24" y="78" font-size="17" fill="#9198a1">how late a record arrives, from its send to its arrival</text>
<text x="24" y="106" font-size="14" fill="#9198a1">the multiplexer 4.0.0 · Kafka 4.3.1, librdkafka 2.8.0 · AMD Ryzen Threadripper PRO 9965WX</text>
<line x1="210.0" y1="136" x2="210.0" y2="330" stroke="#3d444d" stroke-width="1"/>
<text x="210.0" y="354" font-size="14" text-anchor="middle" fill="#9198a1">0 µs</text>
<line x1="316.7" y1="136" x2="316.7" y2="330" stroke="#3d444d" stroke-width="1"/>
<text x="316.7" y="354" font-size="14" text-anchor="middle" fill="#9198a1">250 µs</text>
<line x1="423.3" y1="136" x2="423.3" y2="330" stroke="#3d444d" stroke-width="1"/>
<text x="423.3" y="354" font-size="14" text-anchor="middle" fill="#9198a1">500 µs</text>
<line x1="530.0" y1="136" x2="530.0" y2="330" stroke="#3d444d" stroke-width="1"/>
<text x="530.0" y="354" font-size="14" text-anchor="middle" fill="#9198a1">750 µs</text>
<line x1="636.7" y1="136" x2="636.7" y2="330" stroke="#3d444d" stroke-width="1"/>
<text x="636.7" y="354" font-size="14" text-anchor="middle" fill="#9198a1">1 ms</text>
<line x1="743.3" y1="136" x2="743.3" y2="330" stroke="#3d444d" stroke-width="1"/>
<text x="743.3" y="354" font-size="14" text-anchor="middle" fill="#9198a1">1.25 ms</text>
<line x1="850.0" y1="136" x2="850.0" y2="330" stroke="#3d444d" stroke-width="1"/>
<text x="850.0" y="354" font-size="14" text-anchor="middle" fill="#9198a1">1.5 ms</text>
<text x="530.0" y="386" font-size="15" text-anchor="middle" fill="#9198a1">latency (lower is better)</text>
<rect x="210" y="150" width="3.8" height="26" rx="3" fill="#3987e5"/>
<text x="196" y="162" font-size="17" text-anchor="end" fill="#f0f6fc">multiplexer</text>
<text x="196" y="178" font-size="13" text-anchor="end" fill="#9198a1">p50</text>
<text x="221.8" y="169" font-size="16" fill="#f0f6fc">9 µs</text>
<rect x="210" y="190" width="23.0" height="26" rx="3" fill="#4a4f58"/>
<text x="196" y="202" font-size="17" text-anchor="end" fill="#f0f6fc">Kafka</text>
<text x="196" y="218" font-size="13" text-anchor="end" fill="#9198a1">p50</text>
<text x="241.0" y="209" font-size="16" fill="#f0f6fc">54 µs</text>
<rect x="210" y="252" width="19.6" height="26" rx="3" fill="#3987e5"/>
<text x="196" y="264" font-size="17" text-anchor="end" fill="#f0f6fc">multiplexer</text>
<text x="196" y="280" font-size="13" text-anchor="end" fill="#9198a1">p99</text>
<text x="237.6" y="271" font-size="16" fill="#f0f6fc">46 µs</text>
<rect x="210" y="292" width="526.5" height="26" rx="3" fill="#4a4f58"/>
<text x="196" y="304" font-size="17" text-anchor="end" fill="#f0f6fc">Kafka</text>
<text x="196" y="320" font-size="13" text-anchor="end" fill="#9198a1">p99</text>
<text x="744.5" y="311" font-size="16" fill="#f0f6fc">1.2 ms</text>
</svg>
