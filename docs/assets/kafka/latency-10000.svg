<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">Not batching, 10,000 records a second</title>
<desc id="description">multiplexer, p50: 10 µs; Kafka, p50: 44 µs. multiplexer, p99: 25 µs; Kafka, p99: 131 µs.</desc>
<rect width="960" height="400" rx="6" fill="#ffffff"/>
<text x="24" y="44" font-size="24" font-weight="600" fill="#1f2328">Not batching, 10,000 records a second</text>
<text x="24" y="78" font-size="17" fill="#59636e">how late a record arrives, from its send to its arrival</text>
<text x="24" y="106" font-size="14" fill="#59636e">the multiplexer newer than 3.0.0 · Kafka 4.3.1, librdkafka 2.8.0 · AMD Ryzen Threadripper PRO 9965WX</text>
<line x1="210.0" y1="136" x2="210.0" y2="330" stroke="#d1d9e0" stroke-width="1"/>
<text x="210.0" y="354" font-size="14" text-anchor="middle" fill="#59636e">0 µs</text>
<line x1="316.7" y1="136" x2="316.7" y2="330" stroke="#d1d9e0" stroke-width="1"/>
<text x="316.7" y="354" font-size="14" text-anchor="middle" fill="#59636e">25 µs</text>
<line x1="423.3" y1="136" x2="423.3" y2="330" stroke="#d1d9e0" stroke-width="1"/>
<text x="423.3" y="354" font-size="14" text-anchor="middle" fill="#59636e">50 µs</text>
<line x1="530.0" y1="136" x2="530.0" y2="330" stroke="#d1d9e0" stroke-width="1"/>
<text x="530.0" y="354" font-size="14" text-anchor="middle" fill="#59636e">75 µs</text>
<line x1="636.7" y1="136" x2="636.7" y2="330" stroke="#d1d9e0" stroke-width="1"/>
<text x="636.7" y="354" font-size="14" text-anchor="middle" fill="#59636e">100 µs</text>
<line x1="743.3" y1="136" x2="743.3" y2="330" stroke="#d1d9e0" stroke-width="1"/>
<text x="743.3" y="354" font-size="14" text-anchor="middle" fill="#59636e">125 µs</text>
<line x1="850.0" y1="136" x2="850.0" y2="330" stroke="#d1d9e0" stroke-width="1"/>
<text x="850.0" y="354" font-size="14" text-anchor="middle" fill="#59636e">150 µs</text>
<text x="530.0" y="386" font-size="15" text-anchor="middle" fill="#59636e">latency (lower is better)</text>
<rect x="210" y="150" width="42.7" height="26" rx="3" fill="#2a78d6"/>
<text x="196" y="162" font-size="17" text-anchor="end" fill="#1f2328">multiplexer</text>
<text x="196" y="178" font-size="13" text-anchor="end" fill="#59636e">p50</text>
<text x="260.7" y="169" font-size="16" fill="#1f2328">10 µs</text>
<rect x="210" y="190" width="187.7" height="26" rx="3" fill="#c4c3bd"/>
<text x="196" y="202" font-size="17" text-anchor="end" fill="#1f2328">Kafka</text>
<text x="196" y="218" font-size="13" text-anchor="end" fill="#59636e">p50</text>
<text x="405.7" y="209" font-size="16" fill="#1f2328">44 µs</text>
<rect x="210" y="252" width="106.7" height="26" rx="3" fill="#2a78d6"/>
<text x="196" y="264" font-size="17" text-anchor="end" fill="#1f2328">multiplexer</text>
<text x="196" y="280" font-size="13" text-anchor="end" fill="#59636e">p99</text>
<text x="324.7" y="271" font-size="16" fill="#1f2328">25 µs</text>
<rect x="210" y="292" width="558.9" height="26" rx="3" fill="#c4c3bd"/>
<text x="196" y="304" font-size="17" text-anchor="end" fill="#1f2328">Kafka</text>
<text x="196" y="320" font-size="13" text-anchor="end" fill="#59636e">p99</text>
<text x="776.9" y="311" font-size="16" fill="#1f2328">131 µs</text>
</svg>
