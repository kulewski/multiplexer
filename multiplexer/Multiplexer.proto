// The protocol's messages: MultiplexerMessage is the envelope every frame
// carries; WelcomeMessage, BackendForPacketSearch and DeliveryError are the
// payloads of the protocol's own message types; MultiplexerRules with its
// peer and message descriptions is the schema of the rules file.
// docs/wire_format.md and docs/rules.md describe them from the outside.
syntax = "proto2";  // labels and defaults: the original dialect, said explicitly since protoc warns otherwise

package multiplexer;
import "multiplexer/Logging.proto";
option optimize_for = SPEED;

message MultiplexerPeerDescription {

    // ID of this type
    required uint32 type = 1;

    // name of this type for use in text-based config files
    required string name = 2;

    optional string comment = 3;

    // how many pending messages this peer can have
    optional uint32 queue_size = 4 [default = 1024]; // how big a queue can be

    // some clients are fully passive (never run io_service.run() without timeouts),
    // so e.g. we should not require heartbits from them
    optional bool is_passive = 5 [default = false];
}


message MultiplexerMessageDescription {

    message RoutingRule {
	enum Whom {
	    ALL = 1;
	    ANY = 2;
	}

	// peer name, e.g. "SEARCH"
	// required in configuration files
	optional string peer = 20;

	// peer type, e.g. types::SEARCH
	// required in inary format
	optional uint32 peer_type = 1;

	// forward to how many peers? defaults to ANY
	optional Whom whom = 2 [default = ANY];

	// is a peer presence required?
	optional bool delivery_error_is_error = 3 [default = true];

	// inform the sender about delivery error?
	optional bool report_delivery_error = 4 [default = true];
	optional bool include_original_packet_in_report = 5 [default = false];
    }

    required uint32 type = 1;
    required string name = 2;
    optional string comment = 3;

    // defines routing rules for given packet
    // the first entry here will be used in processing BackendForPackerSearch
    repeated RoutingRule to = 4;
}

message LoggingMethod {
    // this message is only a namespace for the following
    enum Values {
	// this are bit-flags
	CONSOLE = 1;
	FILE = 2;
	BOTH = 3;
    }
}

message Compression {
    enum Values {
	NO_COMPRESSION = 0;
	GZIP = 1;
    };
};

message MultiplexerMessage {
    // packet ID
    // generally required but see http://code.google.com/apis/protocolbuffers/docs/proto.html#simple
    optional uint64 id = 1;

    // The sender's instance id; generally required. Named `from` before
    // 2.4.0, a keyword in Python, under the same number, so that the wire
    // and every recording are unchanged.
    optional uint64 sender = 2;

    // send a message directly to a peer with ID `to'; overrides all rules, also `override_rrules'
    optional uint64 to = 3;

    // report error delivery when routing via MultiplexerMessage.to
    optional bool report_delivery_error = 21 [default = false];
    optional bool include_original_packet_in_report = 22 [default = false];

    // packet type
    required uint32 type = 4;

    // generally required; the actual message we want to send
    optional bytes message = 5;
    optional Compression.Values compression = 24 [default = NO_COMPRESSION];

    // when the packet was sent
    optional uint32 timestamp = 6;

    // packet ID to which we reply
    // this may be change to repeated field in the future
    optional uint64 references = 7;

    // work flow ID
    optional bytes workflow = 8;

    // support for generally overriding the default routing rules
    repeated MultiplexerMessageDescription.RoutingRule override_rrules = 20;

    // request disabling logging to file or stream
    optional LoggingMethod.Values logging_method = 23 [default = BOTH];
}

// Which of a multiplexer's routing paths reach a peer: `any` for rules
// with whom: ANY, `all` for rules with whom: ALL, both on by default; a
// message with `to` always arrives. A peer that wants no new work turns
// them off, which is what a draining backend does. With `last_resort` a
// path that is off still carries what nobody else of the type could take.
// The search a client sends for a backend (BACKEND_FOR_PACKET_SEARCH)
// follows `any`, although it is forwarded to every peer of the type: it
// exists to find a backend for a request that will then be addressed to
// it, so a peer taking no new requests is not offered. Carried in the
// welcome, so a connection registers with it, and changed on a live
// connection with PEER_CONTROL. docs/leaving.md describes the use.
message Routing {
    optional bool any = 1 [default = true];
    optional bool all = 2 [default = true];
    optional bool last_resort = 3 [default = false];
}

// a message to be used in initial handshake
message WelcomeMessage {
    required uint32 type = 1;
    required uint64 id = 2;
    optional Routing routing = 3;  // absent: every path, as before the field existed
}

// The protocol's message types for a peer's routing, in the reserved
// range below 100, the same in every rules file. PEER_CONTROL is sent to a
// multiplexer without `to`; it answers PEER_STATUS, `references` set to
// the request, once the change is in effect: everything routed to the
// peer before the change arrives before the answer.
enum PeerMessageType {
    PEER_CONTROL = 11;
    PEER_STATUS = 12;
}

// What a peer tells the multiplexer about itself: the routing that reaches
// it from now on, replacing what its welcome said.
message PeerControl {
    required Routing routing = 1;
}

// The multiplexer's answer to every PeerControl.
message PeerStatus {
    optional uint64 multiplexer_id = 1;
    optional Routing routing = 2;  // in effect for the peer's connection
    optional string error = 3;     // why the request was ignored; unset when it was applied
}

// a message to be used when searching for working backend
message BackendForPacketSearch {
    required uint32 packet_type = 1;
}

message DeliveryError {
    // ID of the packet which couldn't be delvered
    required uint64 packet_id = 1;

    // list of peer types (from MultiplexerMessageDescription.to rules or from MultiplexerMessage.override_rrules)
    // to which delivery failed;
    // will be empty if delivery failed and message was routed via MultiplexerMessage.to
    repeated uint32 failed_type = 2;

    // ID of the requested recipient if message was routed via MultiplexerMessage.to
    optional uint64 failed_to = 3;

    // was the packet type known to the Multiplexer
    //(set only if no MultiplexerMessage.to() nor MultiplexerMessage.override_rrules() provided)
    optional bool is_known_type = 4;

    // MultiplexerMessage that caused the error
    optional MultiplexerMessage original_message = 20;

    // The original was asked for (include_original_packet_in_report) and
    // left out, because the report would have been over MAX_MESSAGE_SIZE.
    optional bool original_message_omitted = 21;
}

// The protocol's message types for the rules file, in the reserved range
// below 100, the same in every rules file. RULES_CONTROL is sent to a
// multiplexer without `to`; it answers RULES_STATUS, `references` set to
// the request. docs/operations.md describes reloading from the outside.
enum RulesMessageType {
  RULES_CONTROL = 9;
  RULES_STATUS = 10;
}

// The reserved peer type `mxcontrol rules` connects as, accepted by every
// multiplexer; no rules file entry needed. Treated as passive.
enum RulesPeerType {
  RULES_CONTROLLER = 4;
}

// What a peer asks about the rules file. RELOAD makes the multiplexer read
// its rules file now and put it in use if it parses and differs from the
// rules in use; STATUS only asks. Both are answered with RulesStatus.
message RulesControl {
  enum Action {
    RELOAD = 1;
    STATUS = 2;
  }
  required Action action = 1;
}

// The multiplexer's answer to every RulesControl: the rules in use.
message RulesStatus {
  optional uint64 multiplexer_id = 1;
  optional string error = 2;          // RELOAD: why the file was not put in use; the rules in use are as they were
  optional string path = 3;           // the rules file
  optional string fingerprint = 4;    // of the rules in use, the CRC-32 the generated constants carry
  optional uint64 loaded_us = 5;      // when they were read, microseconds since the epoch
  optional uint32 message_types = 6;  // entries in use, the reserved ones included
  optional uint32 peer_types = 7;
  optional bool reloaded = 8;         // RELOAD: the file differed from the rules in use and replaced them
  optional string last_error = 9;     // why the file on disk is not in use, while it is missing or does not parse
}

// type used for reading configuration file multiplexer.rules
message MultiplexerRules {
    repeated MultiplexerMessageDescription type = 1;
    repeated MultiplexerPeerDescription peer = 2;
}

message LogEntriesMessage {
    repeated mx.logging.LogEntry log = 1;
}

message SearchCollectedLogs {
    // select by workflow
    optional bytes workflow = 1;

    // select range of results; results returned will be from oldest-newset,
    // limited to `limit' newest, counting from `offset`'th newest
    // (slicing is done on reversed list)
    optional uint32 limit = 2 [default = 100];
    optional uint32 offset = 3 [default = 0];

    // search in some LogEntry fields
    optional bytes query = 4;
}

message ReplayCollectedEvents {
    // replay events received between from_timestamp ...
    optional uint64 from_timestamp = 1 [default = 0];

    // ... and to_timestamp
    optional uint64 to_timestamp = 2;

    // replay events of type event_type (repeated)
    // if no event_type provided, replay events of all types
    repeated uint32 event_type = 3;
}
